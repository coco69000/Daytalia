name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build for Simulator (No Team Required)
        # Le simulateur accepte tout sans broncher
        run: flutter build ios --simulator --release

      - name: Create IPA Structure
        run: |
          mkdir -p Payload
          # On récupère le build simulateur (qui est en arm64 sur les runners Mac récents)
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r Daytalia.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: Daytalia.ipa