name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Get Packages
        run: flutter pub get

      - name: 📂 Update Pods
        run: pod repo update
        working-directory: ios

      - name: 🏗️ Build iOS (Force Manual)
        # On compile en mode debug car c'est le seul qui accepte de ne pas être signé
        # Sideloadly s'occupera de la signature finale sur ton Windows.
        run: |
          flutter build ios --debug --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphoneos AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath ../build/ios
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"

      - name: 📦 Prepare IPA (Payload)
        run: |
          mkdir -p Payload
          # On cherche le binaire .app généré
          find build/ios -name "Runner.app" -exec cp -r {} Payload/ \;
          zip -qq -r -9 Daytalia.ipa Payload

      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daytalia-IPA
          path: Daytalia.ipa
          retention-days: 3