name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Framework (No Signing)
        # On utilise 'ios --debug' car c'est le mode le plus permissif pour Windows
        # Sideloadly s'occupera de le faire fonctionner sur ton iPhone.
        run: flutter build ios --debug --no-codesign

      - name: Create IPA Structure
        run: |
          mkdir -p Payload
          # On cherche le dossier .app généré dans le dossier Debug-iphoneos
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Daytalia.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: Daytalia.ipa