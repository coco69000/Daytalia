name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🧹 Clean & Get Packages
        # On nettoie pour éviter que d'anciens fichiers de "Debug" ne polluent la "Release"
        run: |
          flutter clean
          flutter pub get

      - name: 📂 Update Pods
        run: pod install --repo-update
        working-directory: ios

      - name: 🏗️ Build iOS unsigned IPA
        # On génère l'app iOS Release sans signature, puis on la regroupe en IPA de manière déterministe.
        run: flutter build ios --release --no-codesign

      - name: 📦 Prepare unsigned IPA
        run: |
          rm -rf Payload Daytalia-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Daytalia-unsigned.ipa Payload

      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daytalia-unsigned-ipa
          path: Daytalia-unsigned.ipa
          retention-days: 3