name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🧹 Clean & Get Packages
        # On nettoie pour éviter que d'anciens fichiers de "Debug" ne polluent la "Release"
        run: |
          flutter clean
          flutter pub get

      - name: 📂 Update Pods
        run: pod install --repo-update
        working-directory: ios

      - name: 🏗️ Build iOS unsigned IPA
        # On génère l'IPA en mode Release (indispensable pour iOS 14+)
        run: flutter build ipa --release --no-codesign

      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daytalia-unsigned-ipa
          # Le chemin correct après un "build ipa" est celui-ci
          path: build/ios/ipa/*.ipa
          retention-days: 3