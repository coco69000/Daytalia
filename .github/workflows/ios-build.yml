name: iOS-ipa-build

on:
  workflow_dispatch: # On garde le déclenchement manuel

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4 # Version à jour

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Get Packages
        run: flutter pub get

      - name: 📂 Update Pods
        run: pod repo update
        working-directory: ios

      - name: 🏗️ Build iOS
        # On utilise --debug car c'est le plus sûr pour Sideloadly sur Windows
        run: flutter build ios --debug --no-codesign
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"

      - name: 📦 Prepare IPA (Payload)
        run: |
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 Daytalia.ipa Payload
        working-directory: build/ios/iphoneos

      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4 # Version à jour
        with:
          name: Daytalia-IPA
          path: build/ios/iphoneos/Daytalia.ipa