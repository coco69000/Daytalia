flutter_native_splash:
  # Couleur de fond (brun doré élégant)
  color: "#EADBC8"
  color_dark: "#EADBC8"

  # Image pour iOS et les anciennes versions d'Android (< Android 12)
  # Ici on garde ton logo original
  image: assets/images/logo1.png
  image_dark: assets/images/logo1.png

  # Branding (Logo secondaire en bas)
  branding: assets/images/brand.png
  branding_dark: assets/images/brand.png
  branding_mode: bottom
  branding_bottom_padding: 65

  # Configuration spécifique pour Android 12+ (Gestion du zoom)
  android_12:
    color: "#EADBC8"
    icon_background_color: "#EADBC8"
    # CONSEIL : Utilise ici une version de ton logo avec plus de marges transparentes
    # pour éviter l'effet de zoom imposé par le système.
    image: assets/images/logo2.png 
    branding: assets/images/brand.png
    branding_mode: bottom
    branding_bottom_padding: 65

  # Paramètres de rendu
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center

  # Optionnel : pour éviter que l'image ne s'étire sur certains écrans
  fullscreen: false