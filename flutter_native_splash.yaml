flutter_native_splash:
  color: "#EADBC8"
  color_dark: "#EADBC8"

  image: assets/images/logo1.png
  image_dark: assets/images/logo1.png

  branding: assets/images/brand.png
  branding_dark: assets/images/brand.png
  branding_mode: bottom
  branding_bottom_padding: 65

  android_12:
    color: "#EADBC8"
    icon_background_color: "#EADBC8"
    image: assets/images/logo2.png 
    branding: assets/images/brand.png
    branding_mode: bottom
    branding_bottom_padding: 65

  android: true
  ios: true
  android_gravity: center
  
  # 1. MODIFICATION ICI : On passe de 'center' à 'scaleAspectFit'
  ios_content_mode: scaleAspectFit

  fullscreen: false